<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}

#intro{
  position:fixed;inset:0;background:#000;z-index:100;overflow:hidden;
}
#particles{
  position:absolute;inset:0;width:100%;height:100%;
}
#finalWelcome{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  margin:0;
  font-size:clamp(55px,11vw,150px);
  font-weight:500;
  letter-spacing:-.075em;
  color:#fff;
  opacity:0;
  white-space:nowrap;
}
#finalWelcome.show{
  animation:finalTextIn .75s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes finalTextIn{
  from{opacity:0;filter:blur(8px)}
  to{opacity:1;filter:blur(0)}
}

#site{opacity:0;transition:opacity 1s ease}
#site.ready{opacity:1}
.hero{height:100vh;position:relative;display:flex;align-items:center;overflow:hidden}
.welcome{
  position:absolute;left:9vw;
  font-size:clamp(55px,11vw,150px);
  font-weight:500;letter-spacing:-.075em;
  opacity:0;transform:translateX(-80px);
}
.hero.enter .welcome{
  animation:welcomeIn 1.2s cubic-bezier(.16,1,.3,1) forwards
}
@keyframes welcomeIn{
  to{opacity:1;transform:translateX(0)}
}
.scrollHint{
  position:absolute;left:9vw;bottom:35px;
  font-size:10px;letter-spacing:.28em;color:#555;
  animation:hint 2s infinite
}
@keyframes hint{50%{opacity:.25;transform:translateY(6px)}}

/* scroll menu */
.menu-wrap{height:390vh;position:relative}
.menu-sticky{
  position:sticky;top:0;height:100vh;
  display:flex;align-items:center;
  padding:0 9vw;overflow:hidden
}
.progress{
  position:absolute;left:9vw;top:10vh;
  color:#444;font-size:10px;letter-spacing:.2em
}
.items{width:min(850px,80vw);position:relative;height:130px}
.item{
  position:absolute;inset:0;
  opacity:0;
  transform:translateY(100px) scale(.96);
  transition:
    opacity .55s ease,
    transform .7s cubic-bezier(.16,1,.3,1),
    background .45s ease,
    color .45s ease,
    border-color .45s ease;
  border:1px solid #242424;border-radius:4px;
  padding:34px 38px;
  display:flex;align-items:center;justify-content:space-between;
  text-decoration:none;color:#fff;background:#050505
}
.item.active{opacity:1;transform:translateY(0) scale(1)}
.item.filled{background:#fff;color:#000;border-color:#fff}
.item .left{display:flex;align-items:center;gap:32px}
.num{font-size:11px;color:#555;letter-spacing:.15em}
.filled .num{color:#888}
.name{font-size:clamp(30px,5vw,64px);font-weight:500;letter-spacing:-.055em}
.arrow{font-size:28px;transition:transform .4s}
.filled .arrow{transform:translateX(8px)}
.item:not(.active){pointer-events:none}

@media(max-width:600px){
  .item{padding:26px 22px}
  .item .left{gap:18px}
  .menu-sticky{padding:0 7vw}
  .progress{left:7vw}
}
</style>
</head>

<body class="lock">

<div id="intro">
  <canvas id="particles"></canvas>
  <div id="finalWelcome">Welcome.</div>
</div></div>

<div id="site">
  <section class="hero">
    <div class="welcome">Welcome.</div>
    <div class="scrollHint">SCROLL</div>
  </section>

  <section class="menu-wrap">
    <div class="menu-sticky">
      <div class="progress">01 — 03</div>
      <div class="items">
        <a class="item" href="https://devparkminjae.github.io/site/admin/">
          <div class="left"><span class="num">01</span><span class="name">Admin</span></div>
          <span class="arrow">→</span>
        </a>
        <a class="item" href="https://devparkminjae.github.io/site/googleotp/">
          <div class="left"><span class="num">02</span><span class="name">Google OTP</span></div>
          <span class="arrow">→</span>
        </a>
        <a class="item" href="https://devparkminjae.github.io/site/otp/">
          <div class="left"><span class="num">03</span><span class="name">GitHub OTP</span></div>
          <span class="arrow">→</span>
        </a>
      </div>
    </div>
  </section>
</div>

<script>
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
const intro=document.getElementById("intro");
const finalText=document.getElementById("finalWelcome");
const site=document.getElementById("site");
const hero=document.querySelector(".hero");
const items=[...document.querySelectorAll(".item")];

let W=innerWidth,H=innerHeight,dpr=1;
let particles=[];
let targets=[];
let started=performance.now();
let finished=false;

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  makeTargets();
}
window.addEventListener("resize",resize);

function makeTargets(){
  const c=document.createElement("canvas");
  const x=c.getContext("2d");
  c.width=Math.ceil(W);
  c.height=Math.ceil(H);

  const fontSize=clamp(W*.115,58,150);
  x.font=`500 ${fontSize}px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif`;
  x.textAlign="center";
  x.textBaseline="middle";
  x.fillStyle="#fff";
  x.fillText("Welcome.",W/2,H/2);

  const image=x.getImageData(0,0,c.width,c.height).data;
  targets=[];
  const gap=Math.max(3,Math.floor(fontSize/24));

  for(let y=0;y<H;y+=gap){
    for(let xx=0;xx<W;xx+=gap){
      if(image[(y*c.width+xx)*4+3]>120) targets.push({x:xx,y});
    }
  }

  const max=1900;
  if(targets.length>max){
    const sampled=[];
    const step=targets.length/max;
    for(let i=0;i<max;i++) sampled.push(targets[Math.floor(i*step)]);
    targets=sampled;
  }

  if(!particles.length || particles.length!==targets.length){
    particles=targets.map((t,i)=>({
      x:W/2+rand(-4,4),
      y:H*.47+rand(-4,4),
      tx:t.x,ty:t.y,
      sx:0,sy:0,
      vx:rand(-1,1),vy:rand(-1,1),
      size:rand(1.1,2.4),
      phase:rand(0,Math.PI*2),
      speed:rand(.7,1.5),
      angle:rand(0,Math.PI*2),
      radius:rand(40,170)
    }));
  }else{
    particles.forEach((p,i)=>{
      p.tx=targets[i].x;p.ty=targets[i].y;
    });
  }
}
resize();

/*
TIMELINE
0.00  큰 점 등장
0.55  빠른 깜빡임 x3
1.70  중앙으로 내려옴
2.55  커짐
3.20  분열 + 작아짐
4.00  사방으로 흩어짐
5.10  마구잡이로 돌아다님
7.20  Welcome 형태를 잡기 시작
8.80  정확한 점 위치에 완전히 정렬
9.20  같은 위치에 실제 글자가 생성
10.0  intro 종료, 스크롤 시작
*/

function draw(now){
  const t=(now-started)/1000;
  ctx.clearRect(0,0,W,H);

  /* 0 — 큰 점 */
  if(t<1.7){
    const appear=clamp((t-.05)/.35,0,1);
    const blinkPhase=Math.floor(clamp((t-.65)/.24,0,3));
    let opacity=1;
    if(t>=.65 && t<1.37) opacity=(blinkPhase%2===0)?.08:1;

    const y=H*(.10 + easeOut(clamp((t-1.7)/.7,0,1))*.40);
    const grow=1 + clamp((t-1.7)/.7,0,1)*5;
    ctx.save();
    ctx.globalAlpha=opacity*appear;
    ctx.shadowBlur=25;
    ctx.shadowColor="#fff";
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(W/2,y,7*grow,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* 1 — 중앙으로 내려오면서 커짐 */
  if(t>=1.7 && t<3.2){
    const q=clamp((t-1.7)/1.5,0,1);
    const y=H*.10+easeOut(q)*H*.40;
    const r=7+easeOut(q)*43;

    ctx.save();
    ctx.shadowBlur=35;
    ctx.shadowColor="rgba(255,255,255,.9)";
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(W/2,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* 2 — 분열하면서 작아지고 흩어지기 시작 */
  if(t>=3.0 && t<4.35){
    const q=easeOut(clamp((t-3.0)/1.35,0,1));
    particles.forEach((p,i)=>{
      const a=(i/particles.length)*Math.PI*2 + p.phase*.1;
      const r=18+q*(Math.min(W,H)*.36+rand(-20,20));
      const x=W/2+Math.cos(a)*r;
      const y=H*.50+Math.sin(a)*r;
      const size=2.5*(1-q)+.7;

      ctx.beginPath();
      ctx.arc(x,y,size,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${.9-q*.25})`;
      ctx.fill();
    });
  }

  /* 3 — 완전히 흩어져 마구잡이로 움직임 */
  if(t>=4.0 && t<7.25){
    const q=clamp((t-4.0)/3.25,0,1);

    particles.forEach((p,i)=>{
      const seed=i*.173+p.phase;
      const dx=Math.sin(t*p.speed*2.1+seed)*W*.35;
      const dy=Math.cos(t*p.speed*1.7+seed*1.7)*H*.35;
      const driftX=Math.sin(t*.8+seed*2)*W*.12;
      const driftY=Math.cos(t*.67+seed)*H*.12;

      p.x=W/2+dx+driftX;
      p.y=H/2+dy+driftY;

      /* 가장자리까지 튀는 느낌 */
      p.x=clamp(p.x,-20,W+20);
      p.y=clamp(p.y,-20,H+20);

      const tw=.45+.45*Math.sin(t*5+p.phase);
      ctx.beginPath();
      ctx.arc(p.x,p.y,.7+tw*.8,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${tw})`;
      ctx.fill();
    });
  }

  /* 4 — Welcome 형태를 잡기 시작 */
  if(t>=7.0 && t<9.15){
    const q=easeInOut(clamp((t-7.0)/2.15,0,1));

    particles.forEach((p,i)=>{
      const seed=i*.173+p.phase;
      const chaosX=Math.sin(7.0*p.speed+seed)*W*.35+
                    Math.sin(7.0*.8+seed*2)*W*.12;
      const chaosY=Math.cos(7.0*p.speed*1.7+seed*1.7)*H*.35+
                    Math.cos(7.0*.67+seed)*H*.12;

      const sx=W/2+chaosX;
      const sy=H/2+chaosY;

      p.x=sx+(p.tx-sx)*q;
      p.y=sy+(p.ty-sy)*q;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${.35+.65*q})`;
      ctx.fill();
    });
  }

  /* 5 — 점들이 정확한 글자 위치에서 안정 */
  if(t>=9.15 && t<9.55){
    const q=easeOut(clamp((t-9.15)/.4,0,1));
    particles.forEach(p=>{
      p.x=p.tx;p.y=p.ty;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle="#fff";
      ctx.fill();
    });
    if(q>0.85) finalText.classList.add("show");
  }

  /* 6 — 실제 글자와 점을 같은 위치에 겹쳐 보여준 뒤 점은 사라짐 */
  if(t>=9.55 && t<10.25){
    const q=easeOut(clamp((t-9.55)/.7,0,1));
    particles.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.tx,p.ty,p.size,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${1-q})`;
      ctx.fill();
    });
  }

  if(t<10.25){
    requestAnimationFrame(draw);
  }else{
    finishIntro();
  }
}

function finishIntro(){
  if(finished)return;
  finished=true;
  intro.style.transition="opacity .9s ease";
  intro.style.opacity="0";
  site.classList.add("ready");
  hero.classList.add("enter");

  setTimeout(()=>{
    intro.remove();
    document.body.classList.remove("lock");
  },900);
}

requestAnimationFrame(draw);

/* 메뉴: 하나씩 정지 → 더 스크롤하면 흰색으로 채움 → 다음 메뉴 */
function updateMenu(){
  const wrap=document.querySelector(".menu-wrap");
  const start=wrap.offsetTop;
  const range=wrap.offsetHeight-innerHeight;
  const p=clamp((scrollY-start)/range,0,1);
  const stage=p*3;

  items.forEach((el,i)=>{
    const local=stage-i;

    if(local>=0 && local<1.15){
      el.classList.add("active");
      el.style.transform=`translateY(${Math.max(0,(1-local)*90)}px) scale(1)`;
    }else{
      el.classList.remove("active");
      el.style.transform=local<0
        ?"translateY(90px) scale(.96)"
        :"translateY(-90px) scale(.96)";
    }

    el.classList.toggle("filled",local>=.45 && local<1.2);
  });
}
window.addEventListener("scroll",updateMenu,{passive:true});
updateMenu();
</script>
</body>
</html>
